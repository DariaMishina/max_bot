name: Deploy to Google Cloud

on:
  push:
    branches:
      - main  # Измените на вашу основную ветку, если она называется иначе
    paths:
      - "bot.py"
      - "webhook_server.py"
      - "send_message.py"
      - "main/**"
      - "handlers/**"
      - "keyboards/**"
      - "static/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"

# The bot and App API workflows update the same checkout on the VM.
concurrency:
  group: production-vm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Test health monitoring
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v test_health_monitor.py
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e  # Остановка при ошибке
            
            echo "🚀 Начинаем деплой..."
            
            # Определяем путь к проекту
            PROJECT_DIR="$HOME/max_bot"
            if [ ! -d "$PROJECT_DIR" ]; then
              PROJECT_DIR="/home/${{ secrets.SSH_USER }}/max_bot"
            fi
            
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "❌ Директория проекта не найдена!"
              exit 1
            fi
            
            cd "$PROJECT_DIR"
            echo "📂 Рабочая директория: $(pwd)"
            
            # Активируем виртуальное окружение
            INSTALL_DEPENDENCIES=false
            if [ ! -d "venv" ]; then
              echo "📦 Создаем виртуальное окружение..."
              python3 -m venv venv
              INSTALL_DEPENDENCIES=true
            fi
            source venv/bin/activate
            
            # Настраиваем Git для неинтерактивного использования
            echo "⚙️ Настраиваем Git..."
            git config --global credential.helper store
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            
            # Получаем последние изменения
            echo "🔄 Получаем последние изменения из Git..."
            # Credential helper уже настроен на сервере, токен сохранен
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            git fetch origin
            if ! git diff --quiet "$PREVIOUS_COMMIT" origin/main -- requirements.txt; then
              INSTALL_DEPENDENCIES=true
            fi
            git reset --hard origin/main
            
            # Обновляем зависимости
            if [ "$INSTALL_DEPENDENCIES" = true ]; then
              echo "📥 Устанавливаем зависимости..."
              python -m pip install -r requirements.txt --quiet
            else
              echo "📦 requirements.txt не изменился, сохраняем установленные зависимости"
            fi
            
            # Перезапускаем сервис
            echo "🔄 Перезапускаем сервис..."
            sudo systemctl restart max-bot.service
            
            # Проверяем status и реальные зависимости через readiness.
            echo "✅ Проверяем systemd и readiness..."
            if ! sudo systemctl is-active --quiet max-bot.service; then
              sudo systemctl status max-bot.service --no-pager -l || true
              echo "❌ Бот не запустился после деплоя"
              exit 1
            fi

            HEALTHY=0
            for attempt in $(seq 1 45); do
              if curl --fail --silent http://127.0.0.1:8081/live >/dev/null \
                && curl --fail --silent http://127.0.0.1:8081/ready >/dev/null; then
                HEALTHY=1
                break
              fi
              sleep 2
            done
            if [ "$HEALTHY" -ne 1 ]; then
              sudo systemctl status max-bot.service --no-pager -l || true
              sudo journalctl -u max-bot.service -n 100 --no-pager || true
              exit 1
            fi
            sudo systemctl status max-bot.service --no-pager -l
            
            echo "📋 Последние строки лога:"
            tail -n 20 bot.log 2>/dev/null || echo "Лог файл пока пуст"
            
            echo "✅ Деплой завершен успешно!"
