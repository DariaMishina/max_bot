# Local-only gateway for the production xTunnel endpoint.
# xTunnel connects to 127.0.0.1:8094; this port must not be exposed publicly.
server {
    listen 127.0.0.1:8094;
    server_name _;

    access_log /var/log/nginx/tarot-api-production.access.log;
    error_log /var/log/nginx/tarot-api-production.error.log warn;

    client_max_body_size 1m;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        return 404;
    }
}
